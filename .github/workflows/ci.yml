name: CI

on:
  push:
    branches: [main]
  pull_request:
    # Deliberately unfiltered. `branches:` on pull_request matches the
    # PR's BASE branch, not its head, so a `[main]` filter gives a stacked
    # PR (one based on another feature branch) zero checks. Keep the
    # filter on push:, where it does mean what it looks like.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          # No go.sum exists yet, and the module cache has nothing to key on.
          cache: false

      # In a Go workspace, ./... only matches packages in the root module.
      # go list -m discovers every module. set -e plus the non-empty check
      # stop a failing `go list -m` from passing having checked nothing.
      - name: Check formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "unformatted files (run gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet all modules
        run: |
          set -euo pipefail
          mods="$(go list -m)"
          [ -n "$mods" ] || { echo "go list -m returned no modules"; exit 1; }
          for mod in $mods; do
            echo "Vetting $mod..."
            go vet "$mod/..."
          done

      - name: Test all modules
        run: |
          set -euo pipefail
          mods="$(go list -m)"
          [ -n "$mods" ] || { echo "go list -m returned no modules"; exit 1; }
          for mod in $mods; do
            echo "Testing $mod..."
            go test -race -count=1 "$mod/..."
          done

      # Every demo ships an offline kit, so a demo without one fails here, and
      # every kit must build.
      - name: Build every demo's offline kit
        run: |
          set -euo pipefail
          for app in demos/*/; do
            [ -d "${app}cmd/kit" ] || { echo "${app} has no cmd/kit (every demo needs an offline kit)"; exit 1; }
            echo "Building ${app}cmd/kit..."
            go build -o /dev/null "./${app}cmd/kit"
          done

      # Samples are other people's apps, so this repo holds only a descriptor for
      # each. A sample with a bad descriptor, or with app code in it, fails here.
      - name: Check the sample descriptors
        run: make check-samples

  # Each demo's UI is built with pnpm and embedded in its Go binary, so this job
  # builds the UI, builds the binary, and checks the binary serves it.
  web:
    runs-on: ubuntu-latest
    env:
      APP: acme-commerce-lenders
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      # The pnpm version is pinned by packageManager in web/package.json.
      - uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          package_json_file: web/package.json

      - name: Install
        run: pnpm --dir web install --frozen-lockfile

      - name: Lint and format check
        run: pnpm --dir web lint

      - name: Type-check
        run: pnpm --dir web type-check

      - name: Test
        run: pnpm --dir web test

      - name: Build the UI into the binary
        run: make web APP="$APP"

      - name: Check the binary serves the built UI
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/kit" "./demos/$APP/cmd/kit"
          "$RUNNER_TEMP/kit" serve --addr 127.0.0.1:18080 --state "$RUNNER_TEMP/state.json" &
          pid=$!
          trap 'kill $pid' EXIT
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:18080/api/status >/dev/null && break
            sleep 0.5
          done
          # The app, and a client-side route loaded directly, both get index.html.
          curl -sf http://127.0.0.1:18080/ | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:18080/inspector | grep -q '<div id="root">'
          # The hashed script the page names is served.
          script="$(curl -sf http://127.0.0.1:18080/ | grep -o '/assets/index-[A-Za-z0-9_-]*\.js' | head -1)"
          test -n "$script"
          curl -sf -o /dev/null "http://127.0.0.1:18080$script"
          # A missing file is a 404, not the app.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/assets/missing.js)" = 404

  # Runs the demo against LocalStack and drives the whole flow over HTTP: seed
  # the world, apply, accept, fund and settle. Needs the LocalStack platform's
  # GitHub OIDC login, which a fork's pull request is not given.
  # localstack-project-id: proj_5f62a1e8 (https://v2.app.localstack.cloud/projects/proj_5f62a1e8)
  # Runtime config (emulator image, env vars, extensions) is fetched by
  # `lstk project start` at run time, so change it on the platform, not here.
  integration:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: false

      - name: Authenticate to LocalStack via GitHub OIDC
        env:
          LOCALSTACK_OIDC_AUDIENCE: https://v2.api.localstack.cloud/github-oidc
          LOCALSTACK_PLATFORM_API_URL: https://v2.api.localstack.cloud
          LOCALSTACK_ORG_ID: "1e09b0c1"
          LOCALSTACK_PROJECT: "proj_5f62a1e8"
        run: |
          set -euo pipefail
          OIDC_TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${LOCALSTACK_OIDC_AUDIENCE}" \
            | jq -r .value)

          PAYLOAD=$(jq -n \
            --arg token "$OIDC_TOKEN" \
            --arg orgId "$LOCALSTACK_ORG_ID" \
            --arg project "$LOCALSTACK_PROJECT" \
            '{token: $token, orgId: $orgId, project: $project}')

          RESPONSE=$(curl -sSf -X POST "${LOCALSTACK_PLATFORM_API_URL}/v1/auth/github-oidc" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          TOKEN=$(echo "$RESPONSE" | jq -r .localstackAuthToken)
          echo "::add-mask::$TOKEN"
          echo "LOCALSTACK_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install lstk and lstk-project
        run: |
          npm install -g @localstack/lstk
          pip install "https://localstack-artifacts-internal.s3.eu-central-1.amazonaws.com/packages/lstk-project/lstk_project-0.1.1-py3-none-any.whl"

      - name: Start LocalStack
        run: |
          mkdir -p "$RUNNER_TEMP/lstk-stage" && exec > >(tee -a "$RUNNER_TEMP/lstk-stage/start.log") 2>&1
          lstk project start "localstack-app-emulators"

      # The test starts the demo itself. Stripe, Plaid and Xero are hosted by
      # LocalStack, and each installs on its first call, which is the test's
      # first reset.
      - name: Run the integration tests
        working-directory: demos/acme-commerce-lenders
        run: go test -tags integration -count=1 -v ./integration

      - name: Show the LocalStack logs
        if: always()
        run: docker logs --tail 200 localstack-aws || true

      - name: Generate a LocalStack diagnostic report
        if: failure()
        run: curl -s localhost:4566/_localstack/diagnose | gzip -cf > diagnose.json.gz || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: localstack-diagnose
          path: diagnose.json.gz
          if-no-files-found: ignore

      - name: Shut down LocalStack
        if: always()
        continue-on-error: true
        run: lstk project shutdown "localstack-app-emulators" --status ${{ job.status }}
