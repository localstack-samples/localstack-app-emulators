# Generated by the LocalStack platform for project "localstack-app-emulators".
# localstack-project-id: proj_5f62a1e8
# Manage it from https://v2.app.localstack.cloud/projects/proj_5f62a1e8 -
# "Update CI workflow" there opens a fresh PR when the config changes.
#
# Requires a LOCALSTACK_AUTH_TOKEN repository secret - use a CI key
# from https://app.localstack.cloud/workspace/auth-tokens
name: LocalStack CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Install the lstk CLI
        run: npm install -g @localstack/lstk

      - name: Install lstk-project
        run: pip install "https://localstack-artifacts-internal.s3.eu-central-1.amazonaws.com/packages/lstk-project/lstk_project-0.1.1-py3-none-any.whl"

      - name: "Start LocalStack for localstack-app-emulators"
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/lstk-stage" && exec > >(tee -a "$RUNNER_TEMP/lstk-stage/start.log") 2>&1
          lstk project start "localstack-app-emulators"

      # No test command configured on the platform yet - this step just
      # verifies the emulator came up. Set one on the project, then use
      # "Update CI workflow" to render it here.
      - name: Verify LocalStack is healthy
        run: curl -sf localhost:4566/_localstack/health

      - name: Show LocalStack logs
        if: always()
        run: docker logs --tail 200 localstack-aws || true

      - name: Generate a diagnostic report
        if: failure()
        run: curl -s localhost:4566/_localstack/diagnose | gzip -cf > diagnose.json.gz || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: localstack-diagnose
          path: diagnose.json.gz

      - name: "Shut down LocalStack for localstack-app-emulators"
        if: always()
        continue-on-error: true
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: lstk project shutdown "localstack-app-emulators" --status ${{ job.status }}
