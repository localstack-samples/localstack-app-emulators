packages:
  - 'apps/*'
  - 'packages/*'

# Supply-chain policy. Semgrep's package_managers.pnpm rules block the build
# without these three; the settings are what the rules are actually asking
# for, so set them rather than suppress the rules. All three are supported by
# the pnpm pinned in packageManager (10.33.0).
#
# Wait seven days (in minutes) before installing a newly published version.
# The npm compromises this defends against were caught and yanked well inside
# that window. Added in pnpm v10.16.0.
minimumReleaseAge: 10080
# Refuse a package update that downgrades the security settings it was
# installed under. Added in pnpm v10.21.0.
trustPolicy: no-downgrade
# Trust is evaluated by publish date across the whole version history, which
# misreads a maintenance release on an older major as a downgrade. semver@6.3.1
# (published 2023-07-10) carries no attestation while the 7.x line does, so
# every fresh resolution of it trips ERR_PNPM_TRUST_DOWNGRADE. It reaches us
# only transitively, via @tanstack/router-plugin -> @babel/core ->
# @babel/helper-compilation-targets, and it is already the version pinned in
# the lockfile -- the error appears on re-resolution, not on a version change.
# Excluded by name so the policy keeps applying to everything else.
# Re-evaluate if semver 6.x ever ships an attested release.
trustPolicyExclude:
  - semver
# qs@6.16.0 (published 2026-08-29) is the only fix for GHSA-4mjr-xmp4-gh2g
# and GHSA-x5fp-wj9c-mxmx (both moderate-severity DoS, GitHub-reviewed,
# disclosed 2026-09-02); no 6.15.x backport exists. Excluded from the
# 7-day age gate so the override below can resolve before the window
# clears naturally. Re-evaluate removal once 6.16.0 ages past the gate.
# body-parser@2.4.0 (2026-10-22) is the only fix for GHSA-27r3-jxmh-p828
# (high); fast-uri@3.1.9 (2026-10-19) is the only 3.x fix for GHSA-333x-w4r6-6crp,
# GHSA-w74x-v6f9-j3xg, GHSA-wjr9-j795-jxcr, GHSA-xhq7-xmqj-769h. Same
# per-package exception as qs, never a loosening of the window itself. Remove
# each once its fix version ages past the gate.
minimumReleaseAgeExclude:
  - qs
  - body-parser
  - fast-uri
# Refuse transitive dependencies resolved from non-registry sources (git,
# tarball URLs, and similar). Added in pnpm v10.26.0.
blockExoticSubdeps: true

# Transitive dependency version pins. pnpm 10.x reads overrides from here, not
# from the `pnpm` field in package.json (which it now ignores). Each entry pins
# a transitive dep to a non-vulnerable version flagged by OSV-Scanner.
overrides:
  yaml: '>=2.8.3'
  hono: '>=4.13.11 <5' # GHSA-2gcr-mfcq-wcc3, GHSA-3hrh-pfw6-9m5x, GHSA-f577-qrjj-4474, GHSA-xrhx-7g5j-rcj5, GHSA-88fw-hqm2-52qc, GHSA-j6c9-x7qj-28xf, GHSA-rv63-4mwf-qqc2, GHSA-wgpf-jwqj-8h8p, GHSA-wwfh-h76j-fc44
  ip-address: '>=10.7.4' # GHSA-22jq-vg5j-6vgg, GHSA-4xrf-jv44-h6hh, GHSA-mwp4-54f8-5fhr
  fast-uri: '>=3.1.9 <4' # GHSA-4c8g-83qw-93j6, GHSA-7p8r-x3mc-p8w7, GHSA-v2hh-gcrm-f6hx, GHSA-5jgf-p345-68v8
  brace-expansion: '>=5.0.12' # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895
  devalue: '>=5.9.3'
  ws: '>=8.21.0' # GHSA-96hv-2xvq-fx4p
  protobufjs: '>=7.6.5 <8 || >=8.6.0' # GHSA-wcpc-wj8m-hjx6, GHSA-f38q-mgvj-vph7, GHSA-j3f2-48v5-ccww
  qs: '>=6.16.0' # GHSA-q8mj-m7cp-5q26, GHSA-4mjr-xmp4-gh2g, GHSA-x5fp-wj9c-mxmx
  fflate: '>=0.4.9 <0.5.0' # GHSA-px8p-9vwx-vf98
  esbuild: '>=0.28.1' # GHSA-gv7w-rqvm-qjhr, GHSA-g7r4-m6w7-qqqr
  vite: '>=6.4.3 <7 || >=7.3.5 <8 || >=8.1.6' # GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3
  js-yaml: '>=4.3.2 <5' # GHSA-h67p-54hq-rp68, GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj
  '@babel/core': '>=7.29.6' # GHSA-4x5r-pxfx-6jf8
  # dompurify enters transitively via posthog-js@1.374.2 (analytics dep
  # in apps/app + apps/marketing). OSV.dev surfaced two findings against
  # 3.4.5 in the earlier 2026-06-15 advisory wave; a later wave the same
  # day added five more (3.4.7/3.4.8/3.4.9 fix versions). A later wave
  # (2026-06-18) added GHSA-cmwh-pvxp-8882, fixed in 3.4.11. Later waves
  # raised the floor to 3.4.17; the override closes every id listed below.
  dompurify: '>=3.4.17' # GHSA-hpcv-96wg-7vj8, GHSA-r47g-fvhr-h676, GHSA-76mc-f452-cxcm, GHSA-rp9w-3fw7-7cwq, GHSA-gvmj-g25r-r7wr, GHSA-vxr8-fq34-vvx9, GHSA-x4vx-rjvf-j5p4, GHSA-cmwh-pvxp-8882, GHSA-c2j3-45gr-mqc4, GHSA-55q2-fjhq-7xh7
  # @opentelemetry/core enters transitively via posthog-js@1.374.2's
  # OTel stack. OSV.dev published GHSA-8988-4f7v-96qf during the same
  # 2026-06-15 wave; the scan caught it after the dompurify bump cleared
  # the prior round.
  '@opentelemetry/core': '>=2.8.0' # GHSA-8988-4f7v-96qf
  # undici enters transitively via dev/build tooling — jsdom@29 (test env)
  # and miniflare@4 (wrangler). OSV.dev flagged two findings in the
  # 2026-06-18 wave, both fixed in 7.28.0. Constrain to the 7.x line the
  # consumers expect — avoid the undici 8.x major bump.
  undici: '>=7.30.1 <8' # GHSA-pr7r-676h-xcf6, GHSA-vmh5-mc38-953g, GHSA-4cwx-7wf7-3272, GHSA-8xcm-r25x-g524, GHSA-jr45-8vmc-qm54, GHSA-m8rv-5g2x-5cg5, GHSA-v3r7-h72x-cjcm

  # Added in the 2026-08-28 advisory sweep. Each enters transitively (build
  # tooling, the Astro/Starlight stack, or posthog-js) so the fix is a floor
  # here rather than a direct-dependency bump.
  '@astrojs/rss': '>=4.0.19 <5' # GHSA-8j5q-mfj2-5q9q
  '@hono/node-server': '>=1.19.15 <2' # GHSA-frvp-7c67-39w9
  body-parser: '>=2.4.0' # GHSA-v422-hmwv-36x6
  browserslist: '>=4.28.7 <5' # GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx
  # Both major lines were in the tree (6.1.2 and 7.1.1) and both are affected.
  # The split range covers each line's own fix rather than forcing a major
  # bump; in practice pnpm converges every consumer on 7.1.5, and the 6.x
  # arm is there so a consumer that genuinely pins 6.x still resolves fixed.
  postcss-selector-parser: '>=6.1.3 <7 || >=7.1.6 <8' # GHSA-w9m9-85wc-3x92
  nanoid: '>=3.3.18 <4' # GHSA-28wg-ghj8-5hjv, GHSA-2v37-7h3g-55p8
  postcss: '>=8.5.23' # GHSA-6g55-p6wh-862q, GHSA-fxqj-rqcc-2cmp, GHSA-r28c-9q8g-f849
  seroval: '>=1.6.3' # GHSA-mv8w-475r-vwqw (CVSS 9.8)
  sharp: '>=0.35.5' # GHSA-f88m-g3jw-g9cj
  svgo: '>=4.1.0 <5' # GHSA-2p49-hgcm-8545
  # Four advisories against the 6.x line. GHSA-vj59-8hwv-xxmv (CVSS 8.2) is
  # fixed in 6.4.8; the other three only in 7.x, so apps/design and
  # apps/marketing moved to Astro 7 rather than carrying them. Floor keeps a
  # future resolution from sliding back under the fix.
  astro: '>=7.3.3 <8' # GHSA-vj59-8hwv-xxmv, GHSA-4g3v-8h47-v7g6, GHSA-f48w-9m4c-m7f5, GHSA-7pw4-f3q4-r2p2

  # Added in the 2026-10-26 advisory sweep. Transitive via the MCP, Astro and
  # vitest toolchains, so a floor here rather than a direct-dependency bump.
  # Ids come from `osv-scanner --lockfile=pnpm-lock.yaml` against this lockfile.
  '@modelcontextprotocol/sdk': '>=1.32.0 <2'
  '@vitest/mocker': '>=4.1.12 <5'
  proxy-addr: '>=2.0.8 <3' # GHSA-jqcg-44mw-7w3h (critical)
  smol-toml: '>=1.9.0 <2'
  source-map-js: '>=1.2.2 <2'
  # Floors the 4.x line only (fix 4.6.6, GHSA-mrhx-c7xc-m3w5, high). The
  # selector matters: a bare `zod` override replaces every consumer's range,
  # and an alternation that admitted 3.x forced @astrojs/sitemap (needs ^4) onto
  # zod 3.25.76 and broke the marketing build. The 3.x line has no fix, so it
  # stays resolvable and the advisory stays visible rather than forcing a major
  # migration on consumers pinned to zod 3.
  'zod@^4': '>=4.6.6'
